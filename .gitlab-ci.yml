# GitLab Pages deployment.
#
# GitLab only serves files from a directory named `public`, so this job
# rebuilds the site from data/*.json and assembles public/ from the output.
# That makes data/ the single source of truth: CI regenerates the HTML on
# every push, so a hand-edited HTML file can never drift from its JSON.

pages:
  stage: deploy
  image: python:3.12-alpine
  script:
    - python build.py
    - rm -rf public
    - mkdir public
    - cp index.html public/
    - cp -r assets public/
    - cp -r archive public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
